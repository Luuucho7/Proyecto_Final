<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clinicas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/banner.css">
</head>

<body>

<header class="banner-barra">

    <div class="banner-izquierda"></div>

    <div class="banner">
        <span class="banner-logo">
            <img src="css/img/foca.jpg" alt="Logo del Hospital de Clínicas">
        </span>
        <div class="banner-texto">
            <h2>Hospital de Clínicas</h2>
            <p>Atención de calidad para toda la comunidad</p>
        </div>
    </div>

    <div class="banner-derecha"></div>

</header>

    <br><br><br>

   
 
    <!-- La ruta envía los datos a la carpeta php/ -->

    <form id="register-block" action="php/login.php" method="POST">

        
<h2 style="text-align:center;">Iniciar sesión</h2>

    

        <label for="feedback-user" class="txtup">Cédula o correo:</label>

        <input type="text" id="feedback-user" class="campo-usuario" name="username" required />

        <br>

        <label for="feedback-pass" class="txtup">Contraseña:</label>


        <div class="password-container">
    <input type="password" id="feedback-pass" class="password_field" name="password" required>

  <button type="button" id="mostrarPass" class="ojo">
    <img src="css/img/ojo_abierto_logo.svg" alt="Mostrar contraseña">
  </button>
       </div>
    
        <div class="acciones-login">
            <button type="submit" class="submit">Enviar</button>
        </div>

        <div id="feedback" class="error"></div>
    </form>

    <a href="html/register.html" class="log">¿No tienes una cuenta? Regístrate aquí.</a>

    <!-- java.js: menu lateral y el ojo para mostrar/ocultar la contrasena -->
    <script src="js/java.js"></script>

    <!-- index.js: envia el formulario a php/login.php sin recargar la pagina -->
    <script src="js/index.js"></script>

</body>

</html>
