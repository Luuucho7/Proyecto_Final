<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-traduccion="titulo">Hospital de Clinicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="cabecera">
        <h1 data-traduccion="titulo">Hospital de Clinicas</h1>
        <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
    </header>

    <br><br><br>

   
 
    <!-- La ruta envía los datos a la carpeta php/ -->

    <form id="register-block" action="php/login.php" method="POST">

        
<h2 style="text-align:center;" data-traduccion="iniciar_sesion">Iniciar sesión</h2>

    

        <input type="text" id="feedback-user" class="campo-usuario" name="username" required />

        <br>

        <label for="password" class="txtup" data-traduccion="contrasena">Contraseña:</label>


        <div class="password-container">
    <input type="password" id="feedback-pass" class="password_field" name="password" required>

  <button type="button" id="mostrarPass" class="ojo">
    <img src="css/img/ojo_abierto_logo.svg" alt="Mostrar contraseña">
  </button>
       </div>
    
        <div class="acciones-login">
            <button type="submit" class="submit" data-traduccion="enviar">Enviar</button>
        </div>

        <div id="feedback" class="error"></div>
    </form>

    <a href="html/register.html" class="log" data-traduccion="registrarse">¿No tienes una cuenta? Regístrate aquí.</a>

    <script src="js/java.js"></script>

</body>

</html>
