<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<header class="cabecera">
        <h1 data-traduccion="titulo">Elemento a trasladar</h1>
        <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
</header>

<body>

    <div class="sectores">

        <div class="biologico">
    <h2>BIOLOGICO</h2>

    <form>
        <input type="text" id="nombre" placeholder="Nombre del Insumo" name="nombre">
        <input type="text" id="estado" placeholder="Estado del insumo" name="estado">
        <input type="submit" id="boton" name="boton" value="Ingresar">
    </form>
</div>

       <div class="no_biologico">
    <h2>NO BIOLOGICO</h2>

    <form>
        <input type="text" id="clasificacion" placeholder="Nombre del Insumo" name="clasificacion">
        <input type="text" id="pendiente" placeholder="Estado del insumo" name="pendiente">
        <input type="submit" id="button" name="button" value="Ingresar">
    </form>
</div>

        <div class="organo">
    <h2>ÓRGANO</h2>

    <form>
        <input type="text" id="persona" placeholder="Nombre del Insumo" name="persona">
        <input type="text" id="en_curso" placeholder="Estado del insumo" name="en_curso">
        <input type="submit" id="tocar" name="tocar" value="Ingresar">
    </form>
</div>

    </div>
    <script src="../js/ingresarInsumo.js"></script>
</body>
</html>
