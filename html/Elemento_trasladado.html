<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/elemento_traslado.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<div class="banner">
        <span class="banner-logo">
            <img src="../css/img/foca.jpg" alt="Logo del Hospital de Clínicas">
        </span>
        <div class="banner-texto">
            <h2 data-traduccion="titulo">Hospital de Clínicas</h2>
            <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
        </div>
    </div>

  
<header class="cabecera">
        <h1 data-traduccion="titulo">Elemento a trasladar</h1>
        <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
</header>

<body>

    <div class="sectores">

        <div class="biologico">
    <h2>BIOLOGICO</h2>

    <form>
        <input type="text" id="nombre" placeholder="Nombre del Insumo" name="nombre" class="escribir_organos">
        <input type="text" id="estado" placeholder="Estado del insumo" name="estado" class="escribir_organos">
        <input type="submit" id="boton" name="boton" value="Ingresar" class="boton_organos">
    </form>
</div>

       <div class="no_biologico">
    <h2>NO BIOLOGICO</h2>

    <form>
        <input type="text" id="clasificacion" placeholder="Nombre del Insumo" name="clasificacion" class="escribir_organos">
        <input type="text" id="pendiente" placeholder="Estado del insumo" name="pendiente" class="escribir_organos">
        <input type="submit" id="button" name="button" value="Ingresar" class="boton_organos">
    </form>
</div>

        <div class="organo">
    <h2>ÓRGANO</h2>

    <form>
        <input type="text" id="persona" placeholder="Nombre del Insumo" name="persona" class="escribir_organos">
        <input type="text" id="en_curso" placeholder="Estado del insumo" name="en_curso" class="escribir_organos">
        <input type="submit" id="tocar" name="tocar" value="Ingresar" class="boton_organos">
    </form>
</div>

    </div>
    <script src="../js/ingresarInsumo.js"></script>
</body>
</html>
