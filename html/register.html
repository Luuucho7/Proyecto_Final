<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clinicas - Registro</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/banner.css">
</head>

<body>

<header class="banner-barra">

    <div class="banner-izquierda">
        <a href="../index.html" class="banner-atras" aria-label="Volver">&larr;</a>
    </div>

    <div class="banner">
        <span class="banner-logo">
            <img src="../css/img/foca.jpg" alt="Logo del Hospital de Clínicas">
        </span>
        <div class="banner-texto">
            <h2>Hospital de Clínicas</h2>
            <p>Atención de calidad para toda la comunidad</p>
        </div>
    </div>

    <div class="banner-derecha"></div>

</header>

    <br><br><br>

    <form id="register-block" action="../php/register.php" method="POST">

        <div class="campo-grupo">
            <div class="texto-arriba">Nombre:</div>
            <input type="text" id="nombre" class="campo-usuario" name="nombre" placeholder="Ej: Juan" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Apellido:</div>
            <input type="text" id="apellido" class="campo-usuario" name="apellido" placeholder="Ej: Pérez" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Cédula de Identidad:</div>
            <input type="text" id="cedula" class="campo-usuario" name="cedula" placeholder="Ej: 12345678" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Correo Electrónico:</div>
            <input type="email" id="correo" class="campo-usuario" name="correo" placeholder="ejemplo@correo.com" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Contraseña:</div>
            <input type="password" id="password" class="password_field" name="password" minlength="8" maxlength="16" placeholder="8-16 caracteres, 1 mayúscula, 1 número" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Confirmar Contraseña:</div>
            <input type="password" id="confirm_password" class="password_field" name="confirm_password" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Dirección:</div>
            <input type="text" id="direccion" class="campo-usuario" name="direccion" placeholder="Calle / Av. y Número" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Teléfono / Celular:</div>
            <input type="tel" id="telefono" class="campo-usuario" name="telefono" placeholder="099123456" required />
        </div>

        <div class="campo-grupo">
            <div class="texto-arriba">Fecha de Nacimiento:</div>
            <input type="date" id="fecha_nacimiento" class="campo-usuario" name="fecha_nacimiento" required />
        </div>

        <div class="acciones-login">
            <button type="submit" class="submit">Enviar</button>
        </div>

        <div id="feedback" class="error"></div>
    </form>

    <a href="../index.html" class="log">¿Ya tienes una cuenta? Inicia sesión aquí.</a>

    <script src="../js/register.js"></script>
</body>

</html>
