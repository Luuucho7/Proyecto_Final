<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital de Clinicas</title>
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/pacientes.css">
    
</head>
<body>

<header class="banner-barra">

    <div class="banner-izquierda">
        <a href="../html/pagina_principal.html" class="banner-atras" aria-label="Volver">&larr;</a>
    </div>

    <div class="banner">
        <span class="banner-logo">
            <img src="../css/img/foca.jpg" alt="Logo del Hospital de Clínicas">
        </span>
        <div class="banner-texto">
            <h2 data-traduccion="titulo">Hospital de Clínicas</h2>
            <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
        </div>
    </div>

    <div class="banner-derecha"></div>

</header>


<!-- Contenido Principal -->

<main class="pacientes">

<!-- Título y Botón de Acción -->
        
<div class="titulo-pacientes">
            <div>
                <h1>Gestión de Pacientes</h1>
                <p class="subtitulo">Administra los registros e historial del hospital</p>
            </div>
            <a href="#formulario" class="boton-nuevo">+ Nuevo Paciente</a>
        </div>

        <!-- Buscador -->
        <div class="buscador">
            <input type="text" placeholder="Buscar por nombre o CI...">
            <button type="button" style="border-left: 0.2rem solid #ddd;">Buscar</button>
        </div>

        <!-- Tabla de Pacientes -->
        <div class="tabla-contenedor">
            <table class="tabla-pacientes">
                <thead>
                    <tr> <!--Define una fila horizontal dentro de la tabla-->
                        <th>Nombre</th>
                        <th>Cédula / Documento</th>
                        <th>Teléfono</th>
                        <th>Estado</th>  <!--th: Define una celda de encabezado o título para la columna-->
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>

        <!-- Formulario para agregar paciente -->
        <div class="formulario-paciente" id="formulario">
            <h2>Registrar Nuevo Paciente</h2>
            <form>
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Ana Gómez" required>

                <label for="documento">Documento de Identidad</label>
                <input type="text" id="cedula" name="documento" placeholder="Ej. 45678901" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 091000111">

                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="activo">Activo</option>
                    <option value="inactivo">Inactivo</option>
                </select>

                <button type="submit" class="boton-guardar">Guardar Paciente</button>
            </form>
        </div>

    </main>

<script src="../js/traducciones.js" data-json="../json/pacientes.json"></script>
<script src="../js/pacientes.js"></script>

</body>

 

 </html>
