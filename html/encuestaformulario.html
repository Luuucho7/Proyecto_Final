    <div class="contenedor">

        <h1>Encuesta de Satisfacción</h1>

        <p class="descripcion">
            Su opinión es muy importante para ayudarnos a mejorar nuestros servicios.
            Complete el siguiente formulario.
        </p>

            <form action="../php/encuesta.php" method="post">

            <div class="grupo">  
                <label for="nombre">Nombre (opcional)</label> 
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">  
            </div>

            <div class="grupo"> 
                <label>Edad</label>
                <input type="number" name="edad" min="0" max="120" required>
            </div>

            <div class="grupo"> 
                <label>Servicio Recibido</label>
                <select name="servicio" required>
                    <option value="">Seleccione una opción</option>
                    <option value="Consulta Médica">Consulta Médica</option>
                    <option value="Emergencia">Emergencia</option>
                    <option value="Laboratorio">Laboratorio</option>
                    <option value="Imagenología">Imagenología</option>
                    <option value="Internación">Internación</option>
                    <option value="Nefrología">Nefrología</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="grupo">
                <label>¿Cómo calificaría la atención recibida?</label>
                <div class="radio">
                    <label><input type="radio" name="atencion" value="Excelente" required> <span>Excelente</span></label>
                    <label><input type="radio" name="atencion" value="Muy Buena" required> <span>Muy Buena</span></label>
                    <label><input type="radio" name="atencion" value="Buena" required> <span>Buena</span></label>
                    <label><input type="radio" name="atencion" value="Regular" required> <span>Regular</span></label>
                    <label><input type="radio" name="atencion" value="Mala" required> <span>Mala</span></label>
                </div>
            </div>

            <div class="grupo">
                <label>¿El personal fue amable?</label>
                <div class="radio"> 
                    <label><input type="radio" name="amabilidad" value="Si" required> <span>Sí</span></label>
                    <label><input type="radio" name="amabilidad" value="No" required> <span>No</span></label>
                </div>
            </div>

            <div class="grupo">
                <label>¿Recibió toda la información necesaria?</label>
                <div class="radio"> 
                    <label><input type="radio" name="informacion" value="Si" required> <span>Sí</span></label>
                    <label><input type="radio" name="informacion" value="No" required> <span>No</span></label>
                </div>
            </div>

            <div class="grupo">
                <label>Califique nuestras instalaciones</label>
                <input type="range" name="instalaciones" min="1" max="10" value="8">
            </div>

            <div class="grupo">
                <label>¿Recomendaría el Hospital de Clínicas?</label>
                <div class="radio">
                    <label><input type="radio" name="recomendacion" value="Si" required> <span>Sí</span></label> 
                    <label><input type="radio" name="recomendacion" value="No" required> <span>No</span></label> 
                </div>
            </div>

            <div class="grupo">
                <label>Sugerencias o comentarios</label>
                <textarea name="comentarios" rows="6" placeholder="Escriba aquí su comentario..."></textarea>
            </div>

            <button type="submit">Enviar Encuesta</button>

        </form>

    </div>
