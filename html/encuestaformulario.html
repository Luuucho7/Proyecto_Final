<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción</title>
    <link rel="stylesheet" href="../css/banner.css">
    <link rel="stylesheet" href="../css/encuesta.css">
</head>
<body>

<header class="banner-barra">

    <div class="banner-izquierda">
        <a href="../html/pagina_principal.html" class="banner-atras" aria-label="Volver">&larr;</a>
    </div>

    <div class="banner">
        <span class="banner-logo">
            <img src="../css/img/foca.jpg" alt="Logo del Hospital de Clínicas">
        </span>
        <div class="banner-texto">
            <h2 data-traduccion="titulo">Hospital de Clínicas</h2>
            <p data-traduccion="descripcion">Atención de calidad para toda la comunidad</p>
        </div>
    </div>

    <div class="banner-derecha"></div>

</header>

    <div class="contenedor">

        <h1>Encuesta de Satisfacción</h1>

        <p class="descripcion">
            Su opinión es muy importante para ayudarnos a mejorar nuestros servicios.
            Complete el siguiente formulario.
        </p>

        <!-- Redirección hacia el script de procesamiento PHP -->
            <form action="../php/encuesta.php" method="post">

            <div class="grupo">  
                <label for="nombre">Nombre (opcional)</label> 
                <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre">  
            </div>

            <div class="grupo"> 
                <label>Edad</label>
                <input type="number" name="edad" min="0" max="120" required>
            </div>

            <div class="grupo"> 
                <label>Servicio Recibido</label>
                <select name="servicio" required>
                    <option value="">Seleccione una opción</option>
                    <option>Consulta Médica</option>
                    <option>Emergencia</option>
                    <option>Laboratorio</option>
                    <option>Imagenología</option>
                    <option>Internación</option>
                    <option>Nefrología</option>
                    <option>Otro</option>
                </select>
            </div>

            <div class="grupo">
                <label>¿Cómo calificaría la atención recibida?</label>
                <div class="radio">
                    <label><input type="radio" name="atencion" value="Excelente" required> Excelente </label>
                    <label><input type="radio" name="atencion" value="Muy Buena" required> Muy Buena </label>
                    <label><input type="radio" name="atencion" value="Buena" required> Buena </label>
                    <label><input type="radio" name="atencion" value="Regular" required> Regular </label>
                    <label><input type="radio" name="atencion" value="Mala" required> Mala </label>
                </div>
            </div>

            <div class="grupo">
                <label>¿El personal fue amable?</label>
                <div class="radio"> 
                    <label><input type="radio" name="amabilidad" value="Si" required> Sí </label>
                    <label><input type="radio" name="amabilidad" value="No" required> No </label>
                </div>
            </div>

            <div class="grupo">
                <label>¿Recibió toda la información necesaria?</label>
                <div class="radio"> 
                    <label><input type="radio" name="informacion" value="Si" required> Sí</label>
                    <label><input type="radio" name="informacion" value="No" required> No</label>
                </div>
            </div>

            <div class="grupo">
                <label>Califique nuestras instalaciones</label>
                <input type="range" name="instalaciones" min="1" max="10" value="8">
            </div>

            <div class="grupo">
                <label>¿Recomendaría el Hospital de Clínicas?</label>
                <div class="radio">
                    <label><input type="radio" name="recomendacion" value="Si" required> Sí </label> 
                    <label><input type="radio" name="recomendacion" value="No" required> No </label> 
                </div>
            </div>

            <div class="grupo">
                <label>Sugerencias o comentarios</label>
                <textarea name="comentarios" rows="6" placeholder="Escriba aquí su comentario..."></textarea>
            </div>

            <button type="submit">Enviar Encuesta</button>

        </form>

    </div>

</body>
</html>
